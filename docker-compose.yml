# Dos servicios: la app y el túnel. Ningún puerto queda expuesto a internet —
# cloudflared abre una conexión saliente y Cloudflare Access hace de puerta.

services:
  casambi:
    build: .
    restart: unless-stopped
    # Solo en loopback, para depurar desde el propio servidor con curl o un
    # túnel SSH. Quien publica la app es cloudflared, por la red interna.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - casambi-data:/data
    environment:
      CASAMBI_SECRET_KEY: ${CASAMBI_SECRET_KEY:?falta en .env — sin ella no se descifran las credenciales}
      CASAMBI_ACCESS_TEAM_DOMAIN: ${CASAMBI_ACCESS_TEAM_DOMAIN:?falta en .env}
      CASAMBI_ACCESS_AUD: ${CASAMBI_ACCESS_AUD:?falta en .env}
      CASAMBI_ACCESS_EMAILS: ${CASAMBI_ACCESS_EMAILS:-}
      # El servidor está en Alemania y el equipo en Guatemala: sin esto la
      # bitácora y los informes se fecharían con la hora del centro de datos.
      CASAMBI_TZ: ${CASAMBI_TZ:-America/Guatemala}

  # Los simuladores de preventa en la web (Incendios, y luego CCTV, WiFi y
  # Casambi Coverage). Archivos estáticos que sube web/tools/publicar.sh del
  # repositorio casambi-wifi-coverage; ver despliegue/README.md, «Simuladores».
  simuladores:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    # Igual que la app: solo en loopback, para comprobar desde el servidor.
    ports:
      - "127.0.0.1:8001:80"
    volumes:
      - /opt/simuladores/www:/srv:ro
      - ./despliegue/simuladores/Caddyfile:/etc/caddy/Caddyfile:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?falta en .env — se copia del panel de Cloudflare Zero Trust}
    depends_on:
      - casambi
      - simuladores

volumes:
  casambi-data:
